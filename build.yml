name: Build IPA
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project BassHaptics.xcodeproj -scheme BassHaptics
          -configuration Release -sdk iphoneos -derivedDataPath build
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/BassHaptics.app Payload/
          zip -r BassHaptics.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BassHaptics-ipa
          path: BassHaptics.ipa
