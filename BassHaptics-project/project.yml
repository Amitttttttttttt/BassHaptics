name: BassHaptics
options:
  bundleIdPrefix: com.example
targets:
  BassHaptics:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [Sources]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Bass Haptics
        NSMicrophoneUsageDescription: Listens to bass to create vibration
        UIBackgroundModes: [audio]
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.basshaptics
        CODE_SIGNING_ALLOWED: "NO"
